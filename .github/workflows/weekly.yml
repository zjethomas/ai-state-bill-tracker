name: Weekly AI bill brief

on:
  # Schedule left commented out during development so it doesn't fire
  # while we're still building. Uncomment when ready to go live.
  # schedule:
  #   - cron: "0 13 * * 1"  # 13:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main

      - name: Commit new brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Weekly AI bill brief"
          git push
